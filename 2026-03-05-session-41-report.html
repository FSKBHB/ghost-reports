async function decrypt() {
    var pwd = document.getElementById('pwd').value;
    var err = document.getElementById('err');
    if (!pwd) { err.textContent = 'Enter password.'; return; }
    try {
        var salt = Uint8Array.from(atob(ED.salt), function(c){return c.charCodeAt(0)});
        var iv = Uint8Array.from(atob(ED.iv), function(c){return c.charCodeAt(0)});
        var data = Uint8Array.from(atob(ED.data), function(c){return c.charCodeAt(0)});
        var keyMaterial = await crypto.subtle.importKey(
            'raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']);
        var key = await crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
            keyMaterial, { name: 'AES-CBC', length: 256 }, false, ['decrypt']);
        var decrypted = await crypto.subtle.decrypt(
            { name: 'AES-CBC', iv: iv }, key, data);
        var text = new TextDecoder().decode(decrypted);
        var padLen = text.charCodeAt(text.length - 1);
        if (padLen > 0 && padLen <= 16) text = text.slice(0, -padLen);
        var blob = new Blob([text], {type: 'text/html; charset=utf-8'});
        var url = URL.createObjectURL(blob);
        var iframe = document.getElementById('viewer');
        iframe.src = url;
        iframe.style.display = 'block';
        document.getElementById('lockUI').style.display = 'none';
    } catch(e) {
        err.textContent = 'Wrong password.';
    }
}
