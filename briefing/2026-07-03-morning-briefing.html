async function decrypt(){
var uid=document.getElementById('uid').value,pwd=document.getElementById('pwd').value,
err=document.getElementById('err'),btn=document.getElementById('btn'),ld=document.getElementById('ld');
if(_locked){return}
if(!uid||!pwd){err.textContent='ID and Password required.';return}
pwd=uid+':'+pwd;
err.textContent='';btn.disabled=true;btn.textContent='...';ld.style.display='block';
await new Promise(function(r){setTimeout(r,50)});
try{
var s=Uint8Array.from(atob(ED.salt),function(c){return c.charCodeAt(0)});
var iv=Uint8Array.from(atob(ED.iv),function(c){return c.charCodeAt(0)});
var d=Uint8Array.from(atob(ED.data),function(c){return c.charCodeAt(0)});
var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pwd),'PBKDF2',false,['deriveKey']);
var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:100000,hash:'SHA-256'},km,{name:'AES-CBC',length:256},false,['decrypt']);
var dc=await crypto.subtle.decrypt({name:'AES-CBC',iv:iv},k,d);
_pwd=pwd;
var t=new TextDecoder().decode(dc);
var p=new DOMParser(),doc=p.parseFromString(t,'text/html');
document.documentElement.replaceChildren();
var h=document.createElement('head');
Array.from(doc.head.childNodes).forEach(function(n){h.appendChild(document.importNode(n,true))});
document.documentElement.appendChild(h);
var b=document.createElement('body');
Array.from(doc.body.attributes).forEach(function(a){b.setAttribute(a.name,a.value)});
Array.from(doc.body.childNodes).forEach(function(n){b.appendChild(document.importNode(n,true))});
document.documentElement.appendChild(b);
document.querySelectorAll('script').forEach(function(os){
var ns=document.createElement('script');
if(os.src)ns.src=os.src;else ns.textContent=os.textContent;
Array.from(os.attributes).forEach(function(a){if(a.name!=='src')ns.setAttribute(a.name,a.value)});
os.parentNode.replaceChild(ns,os)});
if(AM&&AM.length>0)buildAttachPanel();
var hb=document.createElement('a');hb.href='../index.html';hb.textContent='Home';
hb.style.cssText='position:fixed;bottom:1.5rem;right:1.5rem;z-index:99999;background:#2563eb;color:#fff;padding:.6rem 1.2rem;border-radius:999px;text-decoration:none;font-family:sans-serif;font-size:.9rem;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.3)';
document.body.appendChild(hb);
}catch(e){_failCount++;ld.style.display='none';
if(_failCount>=5){_locked=true;btn.disabled=true;btn.textContent='Locked';err.textContent='5회 실패. 30초 후 다시 시도할 수 있습니다.';

function buildAttachPanel(){
var icons={'image':'\u{1F5BC}','document':'\u{1F4C4}','spreadsheet':'\u{1F4CA}','presentation':'\u{1F4CA}','media':'\u{1F3AC}','other':'\u{1F4CE}'};
var totalKB=AM.reduce(function(s,a){return s+a.size_kb},0);
var panel=document.createElement('div');
panel.style.cssText='max-width:900px;margin:2rem auto;background:#1e293b;border:1px solid #334155;border-radius:12px;overflow:hidden;font-family:sans-serif';
var hdr=document.createElement('div');
hdr.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:.8rem 1.2rem;background:#172554;color:#93c5fd;font-weight:600;font-size:.95rem';
hdr.textContent='\u{1F4CE} Attachments ('+AM.length+')';
var sz=document.createElement('span');sz.style.cssText='color:#94a3b8;font-size:.8rem;font-weight:400';

AM.forEach(function(a,i){

btn.onclick=function(){decryptAttach(i,this)};

async function decryptAttach(idx,btn){
var a=AM[idx],origText=btn.textContent;btn.textContent='...';btn.disabled=true;
try{
var depth="../";
var url=depth+'attachments/2026-07-03-morning-briefing/'+a.encrypted_name;
var resp=await fetch(url);if(!resp.ok)throw new Error('fetch failed');
var buf=new Uint8Array(await resp.arrayBuffer());
var salt=buf.slice(0,16),iv=buf.slice(16,32),data=buf.slice(32);
var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(_pwd),'PBKDF2',false,['deriveKey']);
var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},km,{name:'AES-CBC',length:256},false,['decrypt']);
var dc=await crypto.subtle.decrypt({name:'AES-CBC',iv:iv},k,data);
var blob=new Blob([dc]);var burl=URL.createObjectURL(blob);
if(a.type==='image'){
var lb=document.createElement('div');lb.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:100000;display:flex;align-items:center;justify-content:center;cursor:pointer';

}else{var dl=document.createElement('a');dl.href=burl;dl.download=a.name;dl.click()}

}catch(e){btn.textContent='Error';setTimeout(function(){btn.textContent=origText;btn.disabled=false},2000)}}
