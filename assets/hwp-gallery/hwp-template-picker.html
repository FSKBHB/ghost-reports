<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HWP Template Picker — GHOST Racing</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--sf:#1e293b;--sf2:#172554;--ac:#60a5fa;--acd:#1e40af;--tx:#e2e8f0;--txd:#94a3b8;--bd:#334155;--ok:#4ade80;--warn:#fbbf24;--purple:#a78bfa;--purpled:#7c3aed}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',system-ui,sans-serif;min-height:100vh}

/* ── Nav Bar ── */
.nav{display:flex;justify-content:center;gap:.5rem;padding:1rem 1rem .5rem;flex-wrap:wrap}
.nav a{display:inline-flex;align-items:center;gap:.3rem;padding:.4rem 1rem;border-radius:8px;font-size:.85rem;font-weight:600;text-decoration:none;border:1px solid var(--bd);color:var(--txd);transition:all .15s}
.nav a:hover{border-color:var(--ac);color:var(--ac)}
.nav a.current{background:var(--acd);border-color:var(--acd);color:#fff}

/* ── Header ── */
.header{text-align:center;padding:1rem 1rem 1.5rem}
.header h1{color:var(--purple);font-size:1.6rem;margin-bottom:.3rem}
.header p{color:var(--txd);font-size:.9rem}

/* ── Layout ── */
.layout{display:grid;grid-template-columns:200px 1fr;gap:1.5rem;max-width:1200px;margin:0 auto;padding:0 1.5rem 2rem}
@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{display:flex;flex-wrap:wrap;gap:.5rem}}

/* ── Sidebar ── */
.sidebar{position:sticky;top:1rem;align-self:start}
.search-box{width:100%;padding:.5rem .8rem;background:var(--bg);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:.85rem;margin-bottom:1rem;outline:none}
.search-box:focus{border-color:var(--ac)}
.cat-list{list-style:none}
.cat-item{padding:.5rem .8rem;border-radius:8px;cursor:pointer;font-size:.85rem;color:var(--txd);transition:all .15s;display:flex;align-items:center;gap:.5rem;margin-bottom:2px}
.cat-item:hover{background:var(--sf);color:var(--tx)}
.cat-item.active{background:var(--purpled);color:#fff}
.cat-item .cnt{margin-left:auto;font-size:.75rem;opacity:.6}

/* ── Recent Section ── */
.recent-section{margin-bottom:1.5rem}
.recent-section h3{font-size:.85rem;color:var(--txd);margin-bottom:.5rem;font-weight:600}
.recent-cards{display:flex;gap:.5rem;flex-wrap:wrap}
.recent-card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:.5rem .7rem;font-size:.78rem;color:var(--txd);cursor:pointer;transition:all .15s;max-width:180px}
.recent-card:hover{border-color:var(--purple);color:var(--purple)}
.recent-card .rc-name{font-weight:700;color:var(--tx);margin-bottom:2px}
.recent-card .rc-date{font-size:.7rem;opacity:.6}

/* ── Grid ── */
.cat-header{font-size:1.1rem;font-weight:700;color:var(--purple);margin:1.5rem 0 .8rem;padding-bottom:.5rem;border-bottom:1px solid var(--bd)}
.cat-header:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;margin-bottom:1rem}

/* ── Template Card ── */
.tcard{background:var(--sf);border:2px solid var(--bd);border-radius:14px;padding:1.2rem;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.tcard:hover{border-color:var(--purple);transform:translateY(-3px);box-shadow:0 8px 32px rgba(167,139,250,.12)}
.tcard.selected{border-color:var(--ok);box-shadow:0 0 0 3px rgba(74,222,128,.2)}
.tcard-badge{position:absolute;top:10px;right:10px;padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:700;background:var(--purpled);color:#fff}
.tcard-icon{font-size:1.5rem;margin-bottom:.3rem}
.tcard-name{font-size:1rem;font-weight:700;color:var(--tx);margin-bottom:.3rem}
.tcard-desc{font-size:.8rem;color:var(--txd);line-height:1.4;margin-bottom:.8rem}

/* ── Preview Mockup (White bg for HWP) ── */
.hwp-preview{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:.6rem;min-height:100px;margin-bottom:.8rem;position:relative}
.hp-header{height:7px;border-radius:3px;margin-bottom:6px;background:#2563eb}
.hp-subtitle{height:5px;border-radius:2px;margin-bottom:5px;background:#94a3b8;width:40%;opacity:.5}
.hp-line{height:4px;border-radius:2px;margin-bottom:4px;background:#cbd5e1}
.hp-table{display:grid;gap:2px;margin:6px 0;border:1px solid #e2e8f0;border-radius:3px;overflow:hidden}
.hp-table-row{display:grid;gap:1px}
.hp-cell{height:8px;background:#f1f5f9}
.hp-cell.hdr{background:#eff6ff}
.hp-cell.label{background:#dbeafe}
.hp-bullet{display:flex;align-items:center;gap:4px;margin-bottom:3px}
.hp-bullet-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.hp-bullet-line{height:3px;border-radius:1px;background:#cbd5e1;flex:1}
.hp-tag{display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:2px}
.hp-divider{height:1px;background:#e2e8f0;margin:4px 0}
.hp-badge{display:inline-block;padding:1px 4px;border-radius:2px;font-size:5px;font-weight:700}
.hp-qa-block{border-left:2px solid #2563eb;padding-left:4px;margin:3px 0}

/* ── Detail Example Page ── */
.hwp-ex-page{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:1.2rem 1rem;margin:1rem 0;max-height:420px;overflow-y:auto;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.hwp-ex-page::-webkit-scrollbar{width:5px}
.hwp-ex-page::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
.hwp-ex-sec{display:flex;gap:.5rem;margin-bottom:.5rem;align-items:flex-start}
.hwp-ex-label{flex-shrink:0;width:72px;padding:2px 5px;border-radius:4px;background:#eff6ff;color:#2563eb;font-size:.6rem;font-weight:700;text-align:center;margin-top:1px;line-height:1.4}
.hwp-ex-label.req{border:1px solid #93c5fd}
.hwp-ex-body{flex:1;min-height:14px}
.hwp-ex-title{font-size:.85rem;font-weight:700;color:#1e293b;text-align:center;padding:.4rem 0;border-bottom:2px solid #2563eb;margin-bottom:.4rem}
.hwp-ex-text{font-size:.62rem;color:#64748b;line-height:1.5;margin:2px 0}
.hwp-ex-tbl{width:100%;border-collapse:collapse;font-size:.58rem;margin:3px 0}
.hwp-ex-tbl th{background:#eff6ff;border:1px solid #dbeafe;padding:2px 4px;font-weight:700;color:#1e40af;text-align:center}
.hwp-ex-tbl td{border:1px solid #e2e8f0;padding:2px 4px;color:#475569;text-align:center}
.hwp-ex-bul{display:flex;align-items:baseline;gap:4px;margin:2px 0;font-size:.6rem;color:#475569}
.hwp-ex-bul::before{content:'●';color:#2563eb;font-size:.45rem;flex-shrink:0;line-height:1.8}
.hwp-ex-qa{border-left:2px solid #2563eb;padding-left:6px;margin:3px 0}
.hwp-ex-qa .eq{font-size:.6rem;font-weight:700;color:#1e40af}
.hwp-ex-qa .ea{font-size:.58rem;color:#475569}
.hwp-ex-badge{display:inline-block;padding:1px 8px;border-radius:3px;font-size:.6rem;font-weight:700}
.hwp-ex-badge.pass{background:#dcfce7;color:#16a34a}
.hwp-ex-tl{height:6px;background:linear-gradient(90deg,#2563eb,#60a5fa,#93c5fd);border-radius:3px;margin:4px 0}
.hwp-ex-chk{display:flex;align-items:center;gap:4px;margin:2px 0;font-size:.6rem;color:#475569}
.hwp-ex-chk::before{content:'☐';font-size:.7rem;color:#94a3b8;flex-shrink:0}
.hwp-ex-div{height:1px;background:#e2e8f0;margin:4px 0}
.hwp-ex-ba{display:flex;gap:6px;margin:3px 0}
.hwp-ex-ba>div{flex:1;padding:3px;border-radius:3px;font-size:.55rem;text-align:center;font-weight:600}
.hwp-ex-ba .bef{background:#fee2e2;color:#dc2626}
.hwp-ex-ba .aft{background:#dcfce7;color:#16a34a}
.hwp-ex-appr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;margin:3px 0}
.hwp-ex-appr>div{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:2px;padding:4px;text-align:center;font-size:.55rem;color:#64748b;white-space:pre-line}
.hwp-ex-form{background:#eff6ff;border:1px solid #dbeafe;border-radius:4px;padding:4px 8px;font-family:'Times New Roman',serif;font-size:.65rem;color:#1e40af;font-style:italic;margin:3px 0}
.hwp-ex-sr{display:grid;grid-template-columns:70px 1fr;gap:1px;margin:3px 0}
.hwp-ex-sr .sl{background:#eff6ff;padding:2px 5px;font-size:.58rem;font-weight:700;color:#1e40af;border:1px solid #dbeafe}
.hwp-ex-sr .sv{background:#fff;padding:2px 5px;font-size:.58rem;color:#475569;border:1px solid #e2e8f0}
.hwp-ex-hint{text-align:center;font-size:.7rem;color:#94a3b8;margin-bottom:.5rem}

/* ── Tags ── */
.tcard-tags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:.5rem}
.feat-tag{display:inline-block;padding:1px 6px;border-radius:4px;background:var(--bg);font-size:.7rem;color:var(--txd);font-family:monospace}
.tcard-meta{font-size:.75rem;color:var(--txd)}

/* ── Detail Panel ── */
.detail-panel{max-width:1200px;margin:1.5rem auto;background:var(--sf);border:2px solid var(--purple);border-radius:14px;padding:1.5rem;display:none}
.detail-panel.active{display:block}
.detail-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.detail-header h2{color:var(--purple);font-size:1.2rem}
.detail-close{background:none;border:none;color:var(--txd);font-size:1.4rem;cursor:pointer}
.detail-close:hover{color:var(--tx)}

/* Section Checklist */
.section-list{list-style:none;margin:1rem 0}
.section-item{display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;border-radius:6px;transition:background .1s}
.section-item:hover{background:var(--bg)}
.section-item input[type=checkbox]{accent-color:var(--purple);width:16px;height:16px;cursor:pointer}
.section-item label{font-size:.9rem;cursor:pointer;flex:1}
.section-item .req{font-size:.7rem;color:var(--warn);margin-left:.3rem}

/* Options */
.option-row{display:flex;align-items:center;gap:1rem;margin:1rem 0;padding:.8rem;background:var(--bg);border-radius:8px}
.option-row label{font-size:.9rem;color:var(--txd)}
.toggle{position:relative;width:40px;height:22px;cursor:pointer}
.toggle input{display:none}
.toggle-slider{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--bd);border-radius:11px;transition:.2s}
.toggle input:checked+.toggle-slider{background:var(--purpled)}
.toggle-slider::before{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+.toggle-slider::before{transform:translateX(18px)}

/* Result */
.result-section{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--bd)}
.result-section pre{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:1rem;font-size:.8rem;overflow-x:auto;max-height:250px;color:var(--tx);font-family:'JetBrains Mono','Cascadia Code',monospace;white-space:pre-wrap}
.result-actions{display:flex;gap:.5rem;margin-top:.8rem;flex-wrap:wrap}
.result-actions button{padding:.5rem 1.2rem;border:none;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .15s}
.btn-select{background:var(--purpled);color:#fff}.btn-select:hover{background:var(--purple)}
.btn-copy{background:var(--acd);color:#fff}.btn-copy:hover{background:var(--ac)}
.btn-guide{background:var(--sf2);color:var(--ac);border:1px solid var(--bd)!important}.btn-guide:hover{border-color:var(--ac)!important}

/* Toast */
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:var(--ok);color:#000;padding:.6rem 1.5rem;border-radius:8px;font-size:.9rem;font-weight:600;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* ── Quick-Pick Mode ── */
.qp-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;max-width:1100px;margin:0 auto;padding:0 1.5rem 2rem}
@media(max-width:800px){.qp-cards{grid-template-columns:1fr}}
.qp-card{background:var(--sf);border:2px solid var(--bd);border-radius:16px;padding:1.5rem;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.qp-card:hover{border-color:var(--purple);transform:translateY(-4px);box-shadow:0 8px 32px rgba(167,139,250,.15)}
.qp-card.selected{border-color:var(--ok);box-shadow:0 0 0 3px rgba(74,222,128,.2)}
.qp-badge{position:absolute;top:12px;right:12px;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:700}
.badge-a{background:#60a5fa22;color:#60a5fa}
.badge-b{background:#fbbf2422;color:#fbbf24}
.badge-c{background:#4ade8022;color:#4ade80}
.qp-label{font-size:1.1rem;font-weight:700;margin-bottom:.5rem;color:var(--purple)}
.qp-desc{font-size:.85rem;color:var(--txd);margin-bottom:1rem;line-height:1.5}
.qp-select{display:block;width:100%;padding:.7rem;background:var(--purpled);color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .15s;margin-top:.8rem}
.qp-select:hover{background:var(--purple)}
.qp-card.selected .qp-select{background:#16a34a}
.qp-result{max-width:1100px;margin:2rem auto;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:1.2rem;display:none}
.qp-result.active{display:block}
.qp-result h3{color:var(--purple);font-size:1rem;margin-bottom:.5rem}

/* ── No Data ── */
.no-data{text-align:center;padding:3rem;color:var(--txd);display:none}
.no-data textarea{width:100%;max-width:600px;height:200px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;color:var(--tx);padding:1rem;font-family:monospace;font-size:.85rem;margin-top:1rem;resize:vertical}
.no-data button{margin-top:1rem;padding:.6rem 2rem;background:var(--purpled);color:#fff;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer}

.footer{text-align:center;color:var(--txd);font-size:.8rem;padding:2rem 1rem 1rem}
</style>
</head>

  var el = document.createElement(tag);

  var el = _mk(tag, cls);
  el.textContent = text;
  return el;
}
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');

}

var currentFilter = 'all';
var selectedTemplate = null;
var qpData = null;
var qpResultJSON = '';

/* ── Init ── */
function init() {
  document.getElementById('header-desc').textContent =
    '\uC0C1\uD669\uC5D0 \uB9DE\uB294 \uD55C\uAE00 \uBB38\uC11C \uC591\uC2DD\uC744 \uC120\uD0DD\uD558\uC138\uC694';

  var hash = location.hash.slice(1);
  if (hash) {
    try {
      var data = JSON.parse(decodeURIComponent(atob(hash)));
      handleHashData(data);
    } catch(e) {
      try {
        var data2 = JSON.parse(decodeURIComponent(hash));
        handleHashData(data2);
      } catch(e2) {
        showGalleryMode();
      }
    }
  } else {
    showGalleryMode();
  }
}

function handleHashData(data) {
  if (data.mode === 'quick-pick') {
    qpData = data;
    showQuickPickMode();
  } else if (data.mode === 'filter') {
    showGalleryMode();
    if (data.category) {
      filterByCategory(data.category);
    }
  } else {
    showGalleryMode();
  }
}

/* ── Gallery Mode ── */
function showGalleryMode() {
  document.getElementById('gallery-mode').style.display = 'block';
  document.getElementById('quickpick-mode').style.display = 'none';
  document.getElementById('no-data').style.display = 'none';
  buildSidebar();
  renderGrid('all');
  renderRecent();
  setupSearch();
}

function buildSidebar() {
  var list = document.getElementById('cat-list');
  while (list.firstChild) list.removeChild(list.firstChild);
  CATEGORIES.forEach(function(cat) {
    var li = _mk('li', 'cat-item' + (cat.id === currentFilter ? ' active' : ''));
    var iconSpan = _txt('span', '', cat.icon);
    var labelSpan = _txt('span', '', cat.label);
    var count = cat.id === 'all' ? TEMPLATES.length :
      TEMPLATES.filter(function(t) { return t.category === cat.id; }).length;
    var cntSpan = _txt('span', 'cnt', String(count));
    li.appendChild(iconSpan);
    li.appendChild(labelSpan);
    li.appendChild(cntSpan);
    li.addEventListener('click', function() { filterByCategory(cat.id); });
    list.appendChild(li);
  });
}

function filterByCategory(catId) {
  currentFilter = catId;
  // Update sidebar active state
  var items = document.querySelectorAll('.cat-item');
  items.forEach(function(item, i) {
    if (CATEGORIES[i].id === catId) {
      item.classList.add('active');
    } else {
      item.classList.remove('active');
    }
  });
  renderGrid(catId);
}

function renderGrid(filter) {
  var container = document.getElementById('main-grid');
  while (container.firstChild) container.removeChild(container.firstChild);

  var filtered = filter === 'all' ? TEMPLATES :
    TEMPLATES.filter(function(t) { return t.category === filter; });

  var searchVal = (document.getElementById('search-input').value || '').toLowerCase();
  if (searchVal) {
    filtered = filtered.filter(function(t) {
      return t.name.toLowerCase().indexOf(searchVal) >= 0 ||
             t.description.toLowerCase().indexOf(searchVal) >= 0 ||
             t.id.toLowerCase().indexOf(searchVal) >= 0;
    });
  }

  if (filter === 'all' && !searchVal) {
    // Group by category
    CATEGORIES.forEach(function(cat) {
      if (cat.id === 'all') return;
      var catTemplates = filtered.filter(function(t) { return t.category === cat.id; });
      if (catTemplates.length === 0) return;
      var header = _txt('div', 'cat-header', cat.icon + ' ' + cat.label);
      container.appendChild(header);
      var grid = _mk('div', 'grid');
      catTemplates.forEach(function(t) { grid.appendChild(createCard(t)); });
      container.appendChild(grid);
    });
  } else {
    var grid = _mk('div', 'grid');
    filtered.forEach(function(t) { grid.appendChild(createCard(t)); });
    container.appendChild(grid);
  }
}

function createCard(template) {
  var card = _mk('div', 'tcard');
  card.setAttribute('data-id', template.id);
  if (selectedTemplate && selectedTemplate.id === template.id) {
    card.classList.add('selected');
  }

  // Badge (usage count)
  if (template.usage_count > 0) {
    var badge = _txt('span', 'tcard-badge', '\xD7' + template.usage_count);
    card.appendChild(badge);
  }

  // Icon
  var icon = _txt('div', 'tcard-icon', template.icon);
  card.appendChild(icon);

  // Name
  var name = _txt('div', 'tcard-name', template.name);
  card.appendChild(name);

  // Description
  var desc = _txt('div', 'tcard-desc', template.description);
  card.appendChild(desc);

  // Preview mockup
  var preview = _mk('div', 'hwp-preview');
  renderHwpPreview(preview, template);
  card.appendChild(preview);

  // Feature tags
  var tags = _mk('div', 'tcard-tags');
  template.features.forEach(function(f) {
    var tag = _txt('span', 'feat-tag', FEATURE_LABELS[f] || f);

  });
  card.appendChild(tags);

/* ── Template Selection → Detail Panel ── */
function selectTemplate(template) {
  selectedTemplate = template;

  // Update card selected state
  document.querySelectorAll('.tcard').forEach(function(c) {
    if (c.getAttribute('data-id') === template.id) {
      c.classList.add('selected');
    } else {
      c.classList.remove('selected');
    }
  });

  // Build detail panel
  var panel = document.getElementById('detail-panel');
  var title = document.getElementById('detail-title');
  title.textContent = template.icon + ' ' + template.name;
  document.getElementById('detail-close').onclick = function() {
    panel.classList.remove('active');
    selectedTemplate = null;
    document.querySelectorAll('.tcard').forEach(function(c) { c.classList.remove('selected'); });
  };

  var body = document.getElementById('detail-body');
  while (body.firstChild) body.removeChild(body.firstChild);

  // Description
  body.appendChild(_txt('p', '', template.description));

  // Example preview
  renderDetailExample(body, template);

  // Section checklist
  var secTitle = _txt('h3', '', '\uC139\uC158 \uC120\uD0DD');
  secTitle.style.cssText = 'color:var(--purple);font-size:1rem;margin:1rem 0 .5rem';
  body.appendChild(secTitle);

  var secList = _mk('ul', 'section-list');
  template.sections.forEach(function(sec) {
    var li = _mk('li', 'section-item');
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = true;
    cb.id = 'sec-' + sec.id;
    if (sec.required) cb.disabled = true;
    var lbl = document.createElement('label');
    lbl.setAttribute('for', 'sec-' + sec.id);
    lbl.textContent = sec.label;
    li.appendChild(cb);
    li.appendChild(lbl);
    if (sec.required) {
      var req = _txt('span', 'req', '\uD544\uC218');
      li.appendChild(req);
    }
    secList.appendChild(li);
  });
  body.appendChild(secList);

  // Page border toggle
  var optRow = _mk('div', 'option-row');
  var optLabel = _txt('label', '', '\uD398\uC774\uC9C0 \uD14C\uB450\uB9AC');
  optLabel.setAttribute('for', 'page-border');
  var toggle = _mk('label', 'toggle');
  var togInput = document.createElement('input');
  togInput.type = 'checkbox';
  togInput.id = 'page-border';
  togInput.checked = true;
  var togSlider = _mk('span', 'toggle-slider');
  toggle.appendChild(togInput);
  toggle.appendChild(togSlider);
  optRow.appendChild(optLabel);
  optRow.appendChild(toggle);
  body.appendChild(optRow);

  // Result section
  var resSection = _mk('div', 'result-section');
  var resPre = _mk('pre');
  resPre.id = 'detail-result-json';
  resSection.appendChild(resPre);

  var resActions = _mk('div', 'result-actions');
  var btnSelect = _mk('button', 'btn-select');
  btnSelect.textContent = '\uC120\uD0DD \uC644\uB8CC';
  btnSelect.addEventListener('click', function() { finalizeSelection(); });
  var btnCopy = _mk('button', 'btn-copy');
  btnCopy.id = 'detail-copy-btn';
  btnCopy.textContent = '\uD074\uB9BD\uBCF4\uB4DC\uC5D0 \uBCF5\uC0AC';
  btnCopy.addEventListener('click', function() { copyDetailResult(); });

  resActions.appendChild(btnSelect);
  resActions.appendChild(btnCopy);
  resSection.appendChild(resActions);
  body.appendChild(resSection);

  // Show panel
  panel.classList.add('active');
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  updateResultPreview();

  // Listen for checkbox changes
  secList.querySelectorAll('input[type=checkbox]').forEach(function(cb) {
    cb.addEventListener('change', updateResultPreview);
  });
  togInput.addEventListener('change', updateResultPreview);
}

function updateResultPreview() {
  if (!selectedTemplate) return;
  var result = buildResultJSON();
  var pre = document.getElementById('detail-result-json');
  if (pre) pre.textContent = JSON.stringify(result, null, 2);
}

function buildResultJSON() {
  var enabled = [];
  var disabled = [];
  selectedTemplate.sections.forEach(function(sec) {
    var cb = document.getElementById('sec-' + sec.id);
    if (cb && cb.checked) {
      enabled.push(sec.id);
    } else {
      disabled.push(sec.id);
    }
  });
  var borderEl = document.getElementById('page-border');
  return {
    choice: 'gallery',
    template_id: selectedTemplate.id,
    template_name: selectedTemplate.name,
    procedure: selectedTemplate.procedure,
    script: selectedTemplate.script,
    sections_enabled: enabled,
    sections_disabled: disabled,
    options: {
      page_border: borderEl ? borderEl.checked : true
    }
  };
}

function finalizeSelection() {
  var result = buildResultJSON();
  var json = JSON.stringify(result, null, 2);
  navigator.clipboard.writeText(json).then(function() {
    showToast('\u2705 \uBCF5\uC0AC\uB428! \u2014 ' + selectedTemplate.name);
    updateHistory(selectedTemplate.id);
  });
  // Cross-window communication: save to localStorage for Transcribe Wizard
  try {
    localStorage.setItem('ghost-hwp-picker-result', JSON.stringify({
      template_id: selectedTemplate.id,
      template_name: selectedTemplate.name,
      icon: selectedTemplate.icon,
      procedure: selectedTemplate.procedure,
      ts: Date.now()
    }));
  } catch(e) {}
  // If opened from Transcribe Wizard, close this tab and return
  if (window.opener) {
    setTimeout(function() { window.close(); }, 300);
  }
}

function copyDetailResult() {
  var pre = document.getElementById('detail-result-json');
  if (!pre) return;
  navigator.clipboard.writeText(pre.textContent).then(function() {
    var btn = document.getElementById('detail-copy-btn');
    btn.textContent = '\u2705 \uBCF5\uC0AC\uB428!';
    setTimeout(function() { btn.textContent = '\uD074\uB9BD\uBCF4\uB4DC\uC5D0 \uBCF5\uC0AC'; }, 2000);
  });
}

/* ── localStorage History ── */
function getHistory() {
  try {
    return JSON.parse(localStorage.getItem('ghost-hwp-picker-history') || '[]');
  } catch(e) { return []; }
}

function updateHistory(templateId) {
  var history = getHistory();
  history = history.filter(function(h) { return h.id !== templateId; });
  history.unshift({ id: templateId, date: new Date().toISOString().slice(0, 10) });
  if (history.length > 10) history = history.slice(0, 10);
  localStorage.setItem('ghost-hwp-picker-history', JSON.stringify(history));
  renderRecent();
}

function renderRecent() {
  var history = getHistory();
  var section = document.getElementById('recent-section');
  var container = document.getElementById('recent-cards');
  if (!container) return;
  while (container.firstChild) container.removeChild(container.firstChild);
  if (history.length === 0) {
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';
  var show = history.slice(0, 3);
  show.forEach(function(h) {
    var tmpl = TEMPLATES.find(function(t) { return t.id === h.id; });
    if (!tmpl) return;
    var card = _mk('div', 'recent-card');
    card.appendChild(_txt('div', 'rc-name', tmpl.icon + ' ' + tmpl.name));
    card.appendChild(_txt('div', 'rc-date', h.date));
    card.addEventListener('click', function() { selectTemplate(tmpl); });
    container.appendChild(card);
  });
}

/* ── Search ── */
function setupSearch() {
  var input = document.getElementById('search-input');
  input.addEventListener('input', function() {
    renderGrid(currentFilter);
  });
}

/* ── Quick-Pick Mode ── */
function showQuickPickMode() {
  document.getElementById('gallery-mode').style.display = 'none';
  document.getElementById('quickpick-mode').style.display = 'block';
  document.getElementById('no-data').style.display = 'none';
  document.getElementById('header-desc').textContent =
    'HWP \uBB38\uC11C \uC591\uC2DD\uC744 \uC120\uD0DD\uD558\uC138\uC694. \uC120\uD0DD \uACB0\uACFC\uAC00 \uD074\uB9BD\uBCF4\uB4DC\uC5D0 \uBCF5\uC0AC\uB429\uB2C8\uB2E4.';
  renderQuickPickCards();
}

function renderQuickPickCards() {
  var container = document.getElementById('qp-cards');
  while (container.firstChild) container.removeChild(container.firstChild);

  // Card A: Previous
  var cardA = _mk('div', 'qp-card');
  cardA.id = 'qp-card-a';
  cardA.appendChild(_txt('span', 'qp-badge badge-a', 'A'));
  cardA.appendChild(_txt('div', 'qp-label', '\uD83D\uDD04 \uC774\uC804 \uC0AC\uC6A9'));
  var prevTmpl = qpData && qpData.previous ? qpData.previous : {};
  var prevName = prevTmpl.template_name || prevTmpl.template_id || 'Unknown';
  cardA.appendChild(_txt('div', 'qp-desc',
    '"' + prevName + '" \u2014 Proc ' + (prevTmpl.procedure || '?')));
  // Preview
  var prevPreview = _mk('div', 'hwp-preview');
  var tmplPrev = TEMPLATES.find(function(t) {
    return t.id === (prevTmpl.template_id || 'session-report');
  }) || TEMPLATES[0];
  renderHwpPreview(prevPreview, tmplPrev);
  cardA.appendChild(prevPreview);
  var btnA = _txt('button', 'qp-select', '\uC774 \uC591\uC2DD\uC73C\uB85C \uC120\uD0DD');
  cardA.appendChild(btnA);
  cardA.addEventListener('click', function() { selectQP('previous'); });
  container.appendChild(cardA);

  // Card B: AI Recommended
  var cardB = _mk('div', 'qp-card');
  cardB.id = 'qp-card-b';
  cardB.appendChild(_txt('span', 'qp-badge badge-b', 'B'));
  cardB.appendChild(_txt('div', 'qp-label', '\uD83E\uDD16 AI \uCD94\uCC9C'));
  var recTmpl = qpData && qpData.recommended ? qpData.recommended : {};
  var recName = recTmpl.template_name || recTmpl.template_id || 'AI Preset';
  cardB.appendChild(_txt('div', 'qp-desc',
    '"' + recName + '" \u2014 ' + (recTmpl.reason || '')));
  var recPreview = _mk('div', 'hwp-preview');
  var tmplRec = TEMPLATES.find(function(t) {
    return t.id === (recTmpl.template_id || 'session-report');
  }) || TEMPLATES[0];
  renderHwpPreview(recPreview, tmplRec);
  cardB.appendChild(recPreview);
  var btnB = _txt('button', 'qp-select', 'AI \uCD94\uCC9C \uC801\uC6A9');
  cardB.appendChild(btnB);
  cardB.addEventListener('click', function() { selectQP('recommended'); });
  container.appendChild(cardB);

  // Card C: Gallery
  var cardC = _mk('div', 'qp-card');
  cardC.id = 'qp-card-c';
  cardC.appendChild(_txt('span', 'qp-badge badge-c', 'C'));
  cardC.appendChild(_txt('div', 'qp-label', '\u2728 \uAC24\uB7EC\uB9AC\uC5D0\uC11C \uC120\uD0DD'));
  cardC.appendChild(_txt('div', 'qp-desc',
    '8개 카테고리 42개 양식에서 직접 브라우징합니다.'));
  var galleryPreview = _mk('div', 'hwp-preview');
  galleryPreview.style.cssText = 'display:flex;align-items:center;justify-content:center;min-height:100px';
  var gInner = _mk('div');
  gInner.style.textAlign = 'center';
  var gIcon = _txt('div', '', '\uD83D\uDDC2\uFE0F');
  gIcon.style.cssText = 'font-size:2.5rem;margin-bottom:.5rem';
  var gText = _txt('div', '', '\uD14C\uD50C\uB9BF \uAC24\uB7EC\uB9AC \uC5F4\uAE30');
  gText.style.color = '#94a3b8';
  gInner.appendChild(gIcon);
  gInner.appendChild(gText);
  galleryPreview.appendChild(gInner);
  cardC.appendChild(galleryPreview);
  var btnC = _txt('button', 'qp-select', '\uAC24\uB7EC\uB9AC \uC5F4\uAE30');
  cardC.appendChild(btnC);
  cardC.addEventListener('click', function() { switchToGallery(); });
  container.appendChild(cardC);
}

function selectQP(option) {
  document.querySelectorAll('.qp-card').forEach(function(c) { c.classList.remove('selected'); });
  var result;
  if (option === 'previous') {
    document.getElementById('qp-card-a').classList.add('selected');
    var prev = qpData.previous || {};
    result = {
      choice: 'previous',
      action: 'use_existing',
      template_id: prev.template_id || 'session-report',
      procedure: prev.procedure || 1
    };
    document.getElementById('qp-result-title').textContent = 'A: \uC774\uC804 \uC591\uC2DD \uC0AC\uC6A9';
  } else {
    document.getElementById('qp-card-b').classList.add('selected');
    var rec = qpData.recommended || {};
    result = {
      choice: 'recommended',
      action: 'apply_ai',
      template_id: rec.template_id || 'session-report',
      procedure: rec.procedure || 1
    };
    document.getElementById('qp-result-title').textContent = 'B: AI \uCD94\uCC9C \uC801\uC6A9';
  }
  qpResultJSON = JSON.stringify(result, null, 2);
  document.getElementById('qp-result-json').textContent = qpResultJSON;
  var resPanel = document.getElementById('qp-result');
  resPanel.classList.add('active');
  document.getElementById('qp-copy-btn').textContent = '\uD074\uB9BD\uBCF4\uB4DC\uC5D0 \uBCF5\uC0AC';
  document.getElementById('qp-gallery-btn').textContent = '\uAC24\uB7EC\uB9AC \uC5F4\uAE30';
  copyQPResult();
}

function copyQPResult() {
  if (!qpResultJSON) return;
  navigator.clipboard.writeText(qpResultJSON).then(function() {
    var btn = document.getElementById('qp-copy-btn');
    btn.textContent = '\u2705 \uBCF5\uC0AC\uB428!';
    setTimeout(function() { btn.textContent = '\uD074\uB9BD\uBCF4\uB4DC\uC5D0 \uBCF5\uC0AC'; }, 2000);
  });
}

function switchToGallery() {
  document.getElementById('quickpick-mode').style.display = 'none';
  showGalleryMode();
}

/* ── No Data Fallback ── */
function loadManualData() {
  try {
    var raw = document.getElementById('manual-input').value.replace(/[\n\r\t]/g, ' ');
    var data = JSON.parse(raw);
    handleHashData(data);
  } catch(e) {
    alert('Invalid JSON: ' + e.message);
  }
}

init();
</script>
