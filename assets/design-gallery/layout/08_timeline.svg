<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>08. Timeline Layout</title>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; rx: 6; }
      .nav { fill: #1e293b; }
      .accent { fill: #2563eb; }
      .text { fill: #64748b; font-family: sans-serif; font-size: 11px; }
      .text-sm { fill: #64748b; font-family: sans-serif; font-size: 9px; }
      .label { fill: #2563eb; font-family: sans-serif; font-size: 12px; font-weight: 700; }
      .line { fill: none; stroke: #e2e8f0; stroke-width: 1; }
      .line-accent { fill: none; stroke: #2563eb; stroke-width: 2; }
      .placeholder { fill: #e2e8f0; rx: 4; }
    </style>
  </defs>
  <rect width="800" height="500" class="bg"/>
  <rect x="0" y="0" width="800" height="40" class="nav"/>
  <text x="400" y="25" fill="#f1f5f9" class="text" text-anchor="middle" font-weight="700">Development Timeline</text>
  <line x1="400" y1="56" x2="400" y2="440" stroke="#2563eb" stroke-width="2"/>
  <circle cx="400" cy="70" r="8" fill="#2563eb"/>
  <circle cx="400" cy="70" r="4" fill="#fff"/>
  <rect x="40" y="40" width="320" height="60" class="card"/>
  <rect x="52" y="48" width="200" height="8" class="placeholder"/>
  <rect x="52" y="62" width="296" height="6" class="placeholder"/>
  <text x="52" y="88" class="text-sm">Phase A: Concept</text>
  <line x1="360" y1="70" x2="392" y2="70" class="line-accent"/>
  <circle cx="400" cy="150" r="8" fill="#2563eb"/>
  <circle cx="400" cy="150" r="4" fill="#fff"/>
  <rect x="424" y="120" width="320" height="60" class="card"/>
  <rect x="436" y="128" width="200" height="8" class="placeholder"/>
  <rect x="436" y="142" width="296" height="6" class="placeholder"/>
  <text x="436" y="168" class="text-sm">Phase B: FEA</text>
  <line x1="408" y1="150" x2="424" y2="150" class="line-accent"/>
  <circle cx="400" cy="230" r="8" fill="#2563eb"/>
  <circle cx="400" cy="230" r="4" fill="#fff"/>
  <rect x="40" y="200" width="320" height="60" class="card"/>
  <rect x="52" y="208" width="200" height="8" class="placeholder"/>
  <rect x="52" y="222" width="296" height="6" class="placeholder"/>
  <text x="52" y="248" class="text-sm">Phase C: Optimize</text>
  <line x1="360" y1="230" x2="392" y2="230" class="line-accent"/>
  <circle cx="400" cy="310" r="8" fill="#2563eb"/>
  <circle cx="400" cy="310" r="4" fill="#fff"/>
  <rect x="424" y="280" width="320" height="60" class="card"/>
  <rect x="436" y="288" width="200" height="8" class="placeholder"/>
  <rect x="436" y="302" width="296" height="6" class="placeholder"/>
  <text x="436" y="328" class="text-sm">Phase D: Validate</text>
  <line x1="408" y1="310" x2="424" y2="310" class="line-accent"/>
  <circle cx="400" cy="390" r="8" fill="#2563eb"/>
  <circle cx="400" cy="390" r="4" fill="#fff"/>
  <rect x="40" y="360" width="320" height="60" class="card"/>
  <rect x="52" y="368" width="200" height="8" class="placeholder"/>
  <rect x="52" y="382" width="296" height="6" class="placeholder"/>
  <text x="52" y="408" class="text-sm">Phase E: Manufacture</text>
  <line x1="360" y1="390" x2="392" y2="390" class="line-accent"/>
  <text x="400" y="470" class="label" text-anchor="middle">08. Timeline Layout</text>
</svg>
