<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>02. Sidebar Navigation</title>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; rx: 6; }
      .nav { fill: #1e293b; }
      .accent { fill: #2563eb; }
      .text { fill: #64748b; font-family: sans-serif; font-size: 11px; }
      .text-sm { fill: #64748b; font-family: sans-serif; font-size: 9px; }
      .label { fill: #2563eb; font-family: sans-serif; font-size: 12px; font-weight: 700; }
      .line { fill: none; stroke: #e2e8f0; stroke-width: 1; }
      .line-accent { fill: none; stroke: #2563eb; stroke-width: 2; }
      .placeholder { fill: #e2e8f0; rx: 4; }
    </style>
  </defs>
  <rect width="800" height="500" class="bg"/>
  <rect x="0" y="0" width="200" height="500" class="nav"/>
  <rect x="16" y="16" width="24" height="24" class="accent" rx="4"/>
  <text x="48" y="33" fill="#f1f5f9" class="text" font-weight="700">GHOST</text>
  <rect x="8" y="60" width="184" height="26" fill="#2563eb" rx="4"/>
  <text x="24" y="77" fill="#f1f5f9" class="text">Section 1</text>
  <text x="24" y="109" fill="#94a3b8" class="text">Section 2</text>
  <text x="24" y="141" fill="#94a3b8" class="text">Section 3</text>
  <text x="24" y="173" fill="#94a3b8" class="text">Section 4</text>
  <text x="24" y="205" fill="#94a3b8" class="text">Section 5</text>
  <text x="24" y="237" fill="#94a3b8" class="text">Section 6</text>
  <text x="24" y="269" fill="#94a3b8" class="text">Section 7</text>
  <text x="24" y="301" fill="#94a3b8" class="text">Section 8</text>
  <rect x="216" y="16" width="568" height="40" class="placeholder"/>
  <rect x="216" y="70" width="568" height="8" class="placeholder"/>
  <rect x="216" y="86" width="400" height="6" class="placeholder"/>
  <rect x="216" y="110" width="568" height="160" class="card"/>
  <rect x="228" y="122" width="300" height="8" class="placeholder"/>
  <rect x="228" y="140" width="544" height="110" class="placeholder"/>
  <rect x="216" y="290" width="568" height="160" class="card"/>
  <rect x="228" y="302" width="300" height="8" class="placeholder"/>
  <rect x="228" y="320" width="544" height="110" class="placeholder"/>
  <text x="400" y="488" class="label" text-anchor="middle">02. Sidebar Navigation</text>
</svg>
