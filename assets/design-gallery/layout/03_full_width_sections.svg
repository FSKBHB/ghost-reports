<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>03. Full-Width Sections</title>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; rx: 6; }
      .nav { fill: #1e293b; }
      .accent { fill: #2563eb; }
      .text { fill: #64748b; font-family: sans-serif; font-size: 11px; }
      .text-sm { fill: #64748b; font-family: sans-serif; font-size: 9px; }
      .label { fill: #2563eb; font-family: sans-serif; font-size: 12px; font-weight: 700; }
      .line { fill: none; stroke: #e2e8f0; stroke-width: 1; }
      .line-accent { fill: none; stroke: #2563eb; stroke-width: 2; }
      .placeholder { fill: #e2e8f0; rx: 4; }
    </style>
  </defs>
  <rect width="800" height="500" class="bg"/>
  <rect x="0" y="0" width="800" height="40" class="nav"/>
  <text x="400" y="25" class="text" fill="#f1f5f9" text-anchor="middle" font-weight="700">GHOST Racing Report</text>
  <rect x="0" y="40" width="800" height="108" fill="#ffffff"/>
  <rect x="100" y="56" width="300" height="10" class="placeholder"/>
  <rect x="100" y="76" width="600" height="6" class="placeholder"/>
  <rect x="100" y="90" width="600" height="40" class="placeholder"/>
  <line x1="0" y1="148" x2="800" y2="148" class="line"/>
  <rect x="0" y="148" width="800" height="108" fill="#f8fafc"/>
  <rect x="100" y="164" width="300" height="10" class="placeholder"/>
  <rect x="100" y="184" width="600" height="6" class="placeholder"/>
  <rect x="100" y="198" width="600" height="40" class="placeholder"/>
  <line x1="0" y1="256" x2="800" y2="256" class="line"/>
  <rect x="0" y="256" width="800" height="108" fill="#ffffff"/>
  <rect x="100" y="272" width="300" height="10" class="placeholder"/>
  <rect x="100" y="292" width="600" height="6" class="placeholder"/>
  <rect x="100" y="306" width="600" height="40" class="placeholder"/>
  <line x1="0" y1="364" x2="800" y2="364" class="line"/>
  <rect x="0" y="364" width="800" height="108" fill="#f8fafc"/>
  <rect x="100" y="380" width="300" height="10" class="placeholder"/>
  <rect x="100" y="400" width="600" height="6" class="placeholder"/>
  <rect x="100" y="414" width="600" height="40" class="placeholder"/>
  <line x1="0" y1="472" x2="800" y2="472" class="line"/>
  <text x="400" y="488" class="label" text-anchor="middle">03. Full-Width Alternating Sections</text>
</svg>
