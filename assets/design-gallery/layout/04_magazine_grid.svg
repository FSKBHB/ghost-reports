<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>04. Magazine Grid</title>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; rx: 6; }
      .nav { fill: #1e293b; }
      .accent { fill: #2563eb; }
      .text { fill: #64748b; font-family: sans-serif; font-size: 11px; }
      .text-sm { fill: #64748b; font-family: sans-serif; font-size: 9px; }
      .label { fill: #2563eb; font-family: sans-serif; font-size: 12px; font-weight: 700; }
      .line { fill: none; stroke: #e2e8f0; stroke-width: 1; }
      .line-accent { fill: none; stroke: #2563eb; stroke-width: 2; }
      .placeholder { fill: #e2e8f0; rx: 4; }
    </style>
  </defs>
  <rect width="800" height="500" class="bg"/>
  <rect x="0" y="0" width="800" height="48" class="nav"/>
  <text x="400" y="30" fill="#f1f5f9" class="label" text-anchor="middle">GHOST Engineering Magazine</text>
  <rect x="16" y="64" width="380" height="200" class="card"/>
  <rect x="26" y="74" width="360" height="100" class="placeholder"/>
  <rect x="26" y="180" width="360" height="6" class="placeholder"/>
  <rect x="412" y="64" width="372" height="94" class="card"/>
  <rect x="422" y="74" width="352" height="47" class="placeholder"/>
  <rect x="422" y="127" width="352" height="6" class="placeholder"/>
  <rect x="412" y="170" width="180" height="94" class="card"/>
  <rect x="422" y="180" width="160" height="47" class="placeholder"/>
  <rect x="422" y="233" width="160" height="6" class="placeholder"/>
  <rect x="604" y="170" width="180" height="94" class="card"/>
  <rect x="614" y="180" width="160" height="47" class="placeholder"/>
  <rect x="614" y="233" width="160" height="6" class="placeholder"/>
  <rect x="16" y="280" width="250" height="140" class="card"/>
  <rect x="26" y="290" width="230" height="70" class="placeholder"/>
  <rect x="26" y="366" width="230" height="6" class="placeholder"/>
  <rect x="280" y="280" width="250" height="140" class="card"/>
  <rect x="290" y="290" width="230" height="70" class="placeholder"/>
  <rect x="290" y="366" width="230" height="6" class="placeholder"/>
  <rect x="544" y="280" width="240" height="140" class="card"/>
  <rect x="554" y="290" width="220" height="70" class="placeholder"/>
  <rect x="554" y="366" width="220" height="6" class="placeholder"/>
  <text x="400" y="448" class="label" text-anchor="middle">04. Magazine Irregular Grid</text>
</svg>
